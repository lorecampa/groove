[workspace]
members = ["crates/groove-core", "crates/groove-cli", "benchmarks/snapshots", "tools/release"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lorecampa/groove"
readme = "README.md"
keywords = ["git", "worktree", "agents", "cli", "concurrency"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
groove-core = { path = "crates/groove-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
