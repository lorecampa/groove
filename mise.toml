min_version = "2026.10.13"

# Development executables; Rust remains pinned in rust-toolchain.toml.
[tools]
gitleaks = "8.30.1"
"cargo:cargo-audit" = { version = "0.22.2", locked = true }
"cargo:cargo-deny" = { version = "0.20.2", locked = true }
"cargo:cargo-vet" = { version = "0.10.3", locked = true }

[settings.cargo]
# Match the reviewed cargo install --locked source-build policy in CI.
binstall = false

[tasks.doctor]
description = "Check required contributor tools without running the test suite"
run = "bash scripts/check-tools.sh push"
