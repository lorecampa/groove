name: Bug report
description: Report a reproducible Groove failure.
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, follow SECURITY.md instead of posting details here. Remove credentials and private paths from logs.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Groove version or commit, Git version, OS/kernel version, CPU architecture, filesystem, and Rust version if building from source.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands or a minimal supervisor example using a disposable repository.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the JSON error and exit status, if available.
    validations:
      required: true
