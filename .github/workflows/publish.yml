name: Release

# Merging a PR never publishes. A manual run rehearses an existing tag as a draft.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed vVERSION tag to rehearse (draft only; no crates.io)'
        required: true
        type: string

permissions:
  contents: read

# Serialize all release versions, including retries. Never cancel a publication.
concurrency:
  group: groove-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify tag, versions, release notes and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(bash scripts/release.sh validate --tag "$RELEASE_TAG" --branch origin/main)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      release_ref: ${{ needs.validate.outputs.commit }}

  binaries:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Install the binary dependency metadata tool
        run: cargo install --locked cargo-auditable@0.7.7
      - name: Build packaged release sources without test hooks
        run: bash scripts/release.sh packages --release --auditable --target '${{ matrix.target }}'
      - name: Bundle binaries, documentation and checksums
        run: >-
          bash scripts/release.sh bundle
          --bin-dir target/package-check/${{ matrix.target }}/release
          --target ${{ matrix.target }}
          --output target/distribution
      - name: Attest build provenance
        if: github.event.repository.private == false || vars.GROOVE_PRIVATE_ATTESTATIONS == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/distribution/*.tar.gz
      - name: Attest the target's dependency inventory
        if: github.event.repository.private == false || vars.GROOVE_PRIVATE_ATTESTATIONS == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/distribution/*.tar.gz
          sbom-path: target/distribution/groove-${{ needs.validate.outputs.version }}-${{ matrix.target }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries-${{ matrix.target }}
          path: target/distribution/*
          if-no-files-found: error
          retention-days: 30

  publish:
    # Opt in only after the first manual crates.io publication and publisher setup.
    if: github.event_name == 'push' && !contains(github.ref_name, '-') && vars.GROOVE_PUBLISH_CRATES_IO == 'true'
    needs: [validate, checks, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order and verify registry installations
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh publish --tag "$RELEASE_TAG" --execute

  announce:
    needs: [validate, checks, publish, binaries]
    if: >-
      always() && needs.validate.result == 'success' &&
      needs.checks.result == 'success' && needs.binaries.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: target/distribution
      - name: Verify downloaded assets
        working-directory: target/distribution
        run: |
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Assemble notes and create or verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/release.sh notes --output "$RUNNER_TEMP/release-notes.md"
          {
            printf '\n## Install with Cargo\n\n```sh\ncargo install --git https://github.com/%s --tag %s --locked groove-cli\n```\n' "$GH_REPO" "$RELEASE_TAG"
            printf '\nRequires Rust 1.89+, Git 2.40+ and Linux or macOS 13+ (local APFS on macOS).\n'
            printf '\n## Binary downloads\n\n| Archive | Platform |\n| --- | --- |\n'
            for pair in 'x86_64-unknown-linux-gnu|Linux x86_64 (glibc 2.39+)' 'aarch64-apple-darwin|Apple Silicon macOS' 'x86_64-apple-darwin|Intel macOS'; do
              target=${pair%%|*}
              platform=${pair#*|}
              archive="groove-$RELEASE_VERSION-$target.tar.gz"
              printf '| [%s](https://github.com/%s/releases/download/%s/%s) | %s |\n' "$archive" "$GH_REPO" "$RELEASE_TAG" "$archive" "$platform"
            done
            printf '\nDownload the matching SHA256SUMS-TARGET and verify before extracting. Archives include the CLI, licenses, guides and complete agent skill. macOS binaries are not notarized.\n'
            printf '\n[Installation and agent setup](https://github.com/%s/blob/%s/docs/install.md) · [Supported scope](https://github.com/%s/blob/%s/docs/operations.md) · [Changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GH_REPO" "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG"
          } >> "$RUNNER_TEMP/release-notes.md"
          flags=(--execute)
          if [[ "$RELEASE_EVENT" == push && "$RELEASE_VERSION" != *-* ]]; then flags+=(--publish); fi
          bash scripts/github-release.sh "$GH_REPO" "$RELEASE_TAG" target/distribution "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
