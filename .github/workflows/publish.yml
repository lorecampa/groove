name: Release

# Merging a PR never publishes. Push an explicit version tag after its release PR.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize all release versions, including retries. Never cancel a publication.
concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, versions, release notes and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(bash scripts/release.sh validate --tag "$RELEASE_TAG" --branch origin/main)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build packaged release sources without test hooks
        run: bash scripts/release.sh packages --release --target '${{ matrix.target }}'
      - name: Bundle binaries, documentation and checksums
        run: >-
          bash scripts/release.sh bundle
          --bin-dir target/package-check/${{ matrix.target }}/release
          --target ${{ matrix.target }}
          --output target/distribution
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries-${{ matrix.target }}
          path: target/distribution/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, checks, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order and verify registry installations
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh publish --tag "$RELEASE_TAG" --execute

  announce:
    needs: [validate, publish, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: target/distribution
      - name: Verify downloaded assets
        working-directory: target/distribution
        run: |
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release with verified binary assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash scripts/release.sh notes --output "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" target/distribution/* --clobber
          else
            flags=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" target/distribution/* \
              --verify-tag --title "Groove $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
