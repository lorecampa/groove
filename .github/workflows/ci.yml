name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_ref:
        description: 'Validated immutable release commit to check'
        required: false
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      # rust-toolchain.toml is the contributor/release lint policy. Compatibility
      # toolchains below still build and test without imposing different lints.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - name: Install test scanner
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: gitleaks
      - name: Infrastructure regression tests
        run: cargo test --package groove-release --locked
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
      - name: Build extracted packages and exercise production binaries
        run: bash scripts/release.sh packages
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.89.0', stable]
        git: [system, '2.40.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - name: Install test scanner
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: gitleaks
      - name: Install Rust
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component clippy --component rustfmt
          rustup override set '${{ matrix.rust }}'
      - name: Install minimum Git
        if: matrix.git != 'system'
        run: |
          # ubuntu-24.04 already supplies cc, make and zlib development files.
          # Verify the actual prerequisites without upgrading the build-essential
          # metapackage (which adds an unnecessary dependency on Ubuntu mirrors).
          cc --version
          make --version
          printf '#include <zlib.h>\nint main(void) { return zlibVersion() == 0; }\n' | cc -x c - -lz -o "$RUNNER_TEMP/git-build-prerequisites"
          "$RUNNER_TEMP/git-build-prerequisites"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --retry-max-time 300 --max-time 120 -fsSL 'https://www.kernel.org/pub/software/scm/git/git-${{ matrix.git }}.tar.xz' -o "$RUNNER_TEMP/git.tar.xz"
          # kernel.org pub/software/scm/git/sha256sums.asc, Git 2.40.0.
          echo 'b17a598fbf58729ef13b577465eb93b2d484df1201518b708b5044ff623bf46d  '"$RUNNER_TEMP/git.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/git.tar.xz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-${{ matrix.git }}" -j2 prefix="$RUNNER_TEMP/git-install" 'CFLAGS=-O2 -std=gnu99' NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_CURL=YesPlease NO_OPENSSL=YesPlease NO_EXPAT=YesPlease install
          echo "$RUNNER_TEMP/git-install/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          rustc --version
          git --version
          node --version
          npm --version
      - run: cargo test --workspace --all-targets --all-features --locked
        # Isolate fixtures without changing checkout's own Git configuration.
        # User-configuration regressions provide explicit configuration files.
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
      - run: cargo test --workspace --doc --locked
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
      - name: Public API documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --workspace --examples --locked
      - name: Exercise packaged CLI and the reference example
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          cargo install --path crates/groove-cli --locked --root "$RUNNER_TEMP/package"
          GROOVE_CLI_BINARY="$RUNNER_TEMP/package/bin/groove" cargo test -p groove-cli --test durable --locked
          fixture=$(mktemp -d)
          git -C "$fixture" init -q
          git -C "$fixture" -c user.name=CI -c user.email=ci@example.invalid commit --allow-empty -qm initial
          "$RUNNER_TEMP/package/bin/groove" --repo "$fixture" pool init --capacity 2
          cargo run -p groove-core --example agent -- "$fixture" HEAD
      - name: Extended seeded workload
        if: github.event_name == 'workflow_dispatch'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          for seed in 17 42 2026 65537; do
            GROOVE_STRESS_SEED="$seed" GROOVE_STRESS_STEPS=100 cargo test -p groove-core --test stress --locked
            cargo test -p groove-core --test concurrency --locked
          done
  macos:
    name: macOS (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        rust: ['1.89.0', stable]
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
          set-safe-directory: false
      - name: Install test scanner
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.13
          sha256: ${{ runner.arch == 'ARM64' && '92fd6898dc213808d1c81f0bead9668dbea036e5946c94c0e82554603205a3aa' || '4e4a996f4747eb59d55497fdd4b0d60d3add9a06c0dc5d65a70402015ee445d0' }}
          install_args: gitleaks
      - name: Install Rust
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component clippy --component rustfmt
          rustup override set '${{ matrix.rust }}'
      - name: Versions
        run: |
          rustc --version
          git --version
          sw_vers
      - name: Concurrent detailed inspection and release
        if: matrix.rust == 'stable'
        run: cargo test -p groove-cli --all-features --locked --test large_repository_regressions release_waits_for_concurrent_detailed_inspection -- --ignored --nocapture
      - run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
      - run: cargo test --workspace --doc --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Packaged production binaries
        if: matrix.rust == '1.89.0'
        run: |
          bash scripts/release.sh packages
          target=$(rustc -vV | sed -n 's/^host: //p')
          bash scripts/release.sh bundle --bin-dir target/package-check/debug --target "$target" --output "$RUNNER_TEMP/distribution"
      - name: Case-sensitive APFS ownership, readiness and snapshot regressions
        if: matrix.rust == '1.89.0'
        run: |
          # Exercise native APFS, without a nested sparse-image backing store.
          mount="$RUNNER_TEMP/groove-apfs.noindex"
          test ! -e "$mount"
          mkdir "$mount"
          apfs_container=$(diskutil info -plist / | plutil -extract APFSContainerReference raw -)
          [[ $apfs_container =~ ^disk[0-9]+$ ]]
          apfs_name="GrooveTests-$(uuidgen)"
          sudo diskutil apfs addVolume "$apfs_container" APFSX "$apfs_name" -mountpoint "$mount" -quota 2g
          apfs_device=$(diskutil info -plist "$mount" | plutil -extract DeviceIdentifier raw -)
          [[ $apfs_device =~ ^disk[0-9]+s[0-9]+$ ]]
          test "$(diskutil info -plist "$apfs_device" | plutil -extract VolumeName raw -)" = "$apfs_name"
          cleanup_apfs() {
            # Never remove a volume whose identity differs from the one created.
            test "$(diskutil info -plist "$apfs_device" | plutil -extract VolumeName raw -)" = "$apfs_name" || return 1
            sudo diskutil apfs deleteVolume "$apfs_device"
          }
          trap cleanup_apfs EXIT
          sudo chown "$(id -u):$(id -g)" "$mount"
          mkdir -m 700 "$mount/scratch"
          mkdir "$mount/scratch/CaseProbe"
          test ! -e "$mount/scratch/caseprobe"
          rmdir "$mount/scratch/CaseProbe"
          GROOVE_TEST_ROOT="$mount/scratch" cargo test -p groove-core --test snapshots --test ready --test quiescence --test fork_inheritance --locked
          GROOVE_TEST_ROOT="$mount/scratch" cargo test -p groove-cli --test durable --test ready --test quiescence --locked
  audit:
    uses: ./.github/workflows/security.yml
    with:
      release_ref: ${{ inputs.release_ref || github.ref }}
