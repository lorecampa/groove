name: Security

# Scheduling is prepared but consumes no runner until the repository variable is
# explicitly enabled. Hosted compute is currently unavailable.
on:
  workflow_call:
    inputs:
      release_ref:
        description: 'Exact release ref being validated by the caller'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      fuzz:
        description: 'Also run the bounded parser fuzzing smoke tests'
        type: boolean
        default: false
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    if: github.event_name != 'schedule' || vars.GROOVE_SECURITY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install development tools from mise.toml
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
      - run: bash scripts/security.sh
  fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: bash scripts/fuzz.sh
