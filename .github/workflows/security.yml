name: Security

# Scheduling is prepared but consumes no runner until the repository variable is
# explicitly enabled. Hosted compute is currently unavailable.
on:
  workflow_call:
    inputs:
      release_ref:
        description: 'Exact release ref being validated by the caller'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      fuzz:
        description: 'Also run the bounded parser fuzzing smoke tests'
        type: boolean
        default: false
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    if: github.event_name != 'schedule' || vars.GROOVE_SECURITY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install security tools with the patched contributor toolchain
        run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-vet@0.10.3
      - name: Install the pinned secret scanner
        run: |
          curl --proto '=https' --tlsv1.2 --retry 3 --max-time 120 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: bash scripts/security.sh
  fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-11-12 --profile minimal
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: bash scripts/fuzz.sh
