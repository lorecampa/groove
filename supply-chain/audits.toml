[[audits.time]]
who = "Codex (OpenAI)"
criteria = "safe-to-deploy"
version = "0.3.47"
notes = """
Reviewed the registry source, manifest, features, unsafe boundaries and ambient
capabilities. No build script, process execution or networking. Date/time
constructors validate ranges before unchecked arithmetic; reviewed packed
representations, nonzero invariants, initialized formatting caches, bounded
month/weekday parsing and the Unix/Windows timezone FFI and refresh APIs.
Optional random/serialization adapters retain checked ranges. Groove enables
std, formatting, parsing and macros, not local-offset or large-dates; it uses
UTC only. Transitive crates and procedural macros have separate audit evidence.
This is a source security review, not exhaustive functional verification or
native macOS runtime validation.
"""
