[package]
name = "groove-cli"
description = "Machine-readable CLI for Groove worktree pools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "groove"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
time = { version = "0.3.47", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
toml = "1.2"
toml_edit = "0.23"
shell-words = "1"
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
groove-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
libc.workspace = true
clap_complete = "4"

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
jsonschema = { version = "0.33", default-features = false }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[features]
test-hooks = ["groove-core/test-hooks"]
