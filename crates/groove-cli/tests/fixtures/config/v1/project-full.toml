schema_version = 1

[workspace]
port_base = 9000
environment = { LABEL = "{slot}:{task}" }

[caches.build]
paths = ["ignored/build"]
inputs = ["Cargo.lock"]
key = "toolchain-v1"
mode = "reflink"
max_bytes = 4096
max_files = 12

[setup.dev]
cache = "build"
[[setup.dev.steps]]
name = "prepare"
command = ["touch", "MUST_NOT_RUN"]
timeout_ms = 0
when = "cache_miss"

[recipes.test]
command = ["touch", "MUST_NOT_RUN"]
timeout_ms = 1234
requires_setup = "dev"

[agents.fixture]
command = ["touch", "MUST_NOT_RUN"]
timeout_ms = 0
requires_setup = "dev"
