[package]
name = "groove-core"
description = "Descriptor-owned, crash-recoverable Git worktree pools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tempfile.workspace = true
libc.workspace = true
sha2 = "0.11"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }

[dev-dependencies]
toml = "0.9"
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true

[features]
test-hooks = []
